name: Deploy Protected CPD Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build protected website
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path(".")
          output = Path("_site")

          shutil.copytree(
              root,
              output,
              dirs_exist_ok=True,
              ignore=shutil.ignore_patterns(
                  ".git", ".github", "_site", "__pycache__
              )
          )

          guard_file = output / "js" / "auth-guard.js"

          if not guard_file.is_file():
              raise SystemExit("ERROR: js/auth-guard.js is missing.")

          public_pages = {
              "index.html",
              "forgot-password.html",
              "forgotten-password.html",
              "status.html",
              "404.html"
          }

          protected_count = 0

          for page in output.rglob("*.html"):
              relative = page.relative_to(output)

              if (
                  len(relative.parts) == 1
                  and relative.name.lower() in public_pages
              ):
                  print(f"PUBLIC: {relative}")
                  continue

              content = page.read_text(encoding="utf-8")

              if not re.search(r"</body\s*>", content, re.I):
                  raise SystemExit(
                      f"ERROR: No closing body tag in {relative}"
                  )

              depth = len(relative.parts) - 1
              prefix = "../" * depth

              # Remove all old master guard tags.
              content = re.sub(
                  r"<script\b(?=[^>]*data-master-auth-guard)[^>]*>"
                  r"\s*</script\s*>",
                  "",
                  content,
                  flags=re.I
              )

              # Remove old auth-guard script tags, too.
              content = re.sub(
                  r"<script\b(?=[^>]*src\s*=\s*['\"][^'\"]*"
                  r"auth-guard\.js[^'\"]*['\"])[^>]*>"
                  r"\s*</script\s*>",
                  "",
                  content,
                  flags=re.I
              )

              # Load Supabase configuration before the guard.
              # Existing scripts are retained; missing scripts are added.
              required_scripts = [
                  (
                      r"supabase-js",
                      '<script src="https://cdn.jsdelivr.net/npm/'
                      '@supabase/supabase-js@2"></script>'
                  ),
                  (
                      r"js/config\.js",
                      f'<script src="{prefix}js/config.js"></script>'
                  ),
                  (
                      r"js/supabase\.js",
                      f'<script src="{prefix}js/supabase.js"></script>'
                  )
              ]

              additions = []

              for pattern, tag in required_scripts:
                  if not re.search(
                      r"<script\b[^>]*\bsrc\s*=\s*['\"][^'\"]*"
                      + pattern
                      + r"[^'\"]*['\"]",
                      content,
                      re.I
                  ):
                      additions.append(tag)

              guard_tag = (
                  f'<script data-master-auth-guard '
                  f'src="{prefix}js/auth-guard.js"></script>'
              )

              additions.append(guard_tag)

              insertion = "\n" + "\n".join(additions) + "\n"

              content = re.sub(
                  r"</body\s*>",
                  lambda match: insertion + match.group(0),
                  content,
                  count=1,
                  flags=re.I
              )

              page.write_text(content, encoding="utf-8")
              protected_count += 1
              print(f"PROTECTED: {relative}")

          if protected_count == 0:
              raise SystemExit("ERROR: No protected HTML pages found.")

          print(f"Protected HTML pages processed: {protected_count}")
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
