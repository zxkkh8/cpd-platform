name: Deploy Protected CPD Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build protected website
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path(".")
          output = Path("_site")

          shutil.copytree(
              root,
              output,
              dirs_exist_ok=True,
              ignore=shutil.ignore_patterns(
                  ".git", ".github", "_site", "__pycache__"
              )
          )

          guard_file = output / "js" / "auth-guard.js"

          if not guard_file.exists():
              raise SystemExit("ERROR: js/auth-guard.js is missing.")

          public_pages = {
              "index.html",
              "forgot-password.html",
              "forgotten-password.html",
              "status.html",
              "404.html"
          }

          protected_count = 0

          for page in output.rglob("*.html"):
              relative = page.relative_to(output)

              # Keep only the root-level public pages public.
              if len(relative.parts) == 1 and relative.name.lower() in public_pages:
                  print(f"PUBLIC: {relative}")
                  continue

              content = page.read_text(encoding="utf-8")

              if not re.search(r"</body\s*>", content, re.I):
                  raise SystemExit(
                      f"ERROR: {relative} has no closing body tag."
                  )

              depth = len(relative.parts) - 1
              prefix = "../" * depth

              additions = []

              def has_script(pattern):
                  return re.search(
                      r"<script\b[^>]*\bsrc\s*=\s*['\"][^'\"]*"
                      + pattern
                      + r"[^'\"]*['\"]",
                      content,
                      re.I
                  ) is not None

              if not has_script(r"supabase-js"):
                  additions.append(
                      '<script src="https://cdn.jsdelivr.net/npm/'
                      '@supabase/supabase-js@2"></script>'
                  )

              if not has_script(r"js/config\.js"):
                  additions.append(
                      f'<script src="{prefix}js/config.js"></script>'
                  )

              if not has_script(r"js/supabase\.js"):
                  additions.append(
                      f'<script src="{prefix}js/supabase.js"></script>'
                  )

              if not has_script(r"js/auth-guard\.js"):
                  additions.append(
                      f'<script data-master-auth-guard '
                      f'src="{prefix}js/auth-guard.js"></script>'
                  )

              if additions:
                  insertion = "\n" + "\n".join(additions) + "\n"
                  content = re.sub(
                      r"</body\s*>",
                      lambda match: insertion + match.group(0),
                      content,
                      count=1,
                      flags=re.I
                  )
                  page.write_text(content, encoding="utf-8")

              protected_count += 1
              print(f"PROTECTED: {relative}")

          print(f"Protected HTML pages processed: {protected_count}")
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
