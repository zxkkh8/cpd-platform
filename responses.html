<!DOCTYPE html>
<html>
<head>
<title>Responses</title>

<style>
body{
margin:0;
background:#f3f5f9;
font-family:"Segoe UI",sans-serif;
padding:30px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
}

.card h2{
margin:0;
color:#124191;
font-size:32px;
}

table{
width:100%;
background:white;
border-radius:12px;
border-collapse:collapse;
overflow:hidden;
}

th,td{
padding:16px;
border-bottom:1px solid #e5e7eb;
text-align:left;
}
</style>
</head>

<body>

<h1>Responses</h1>

<div class="stats">

<div class="card">
<h2>124</h2>
Responses
</div>

<div class="card">
<h2>89%</h2>
Average Score
</div>

<div class="card">
<h2>94%</h2>
Pass Rate
</div>

<div class="card">
<h2>12m</h2>
Average Time
</div>

</div>

<table>

<tr>
<th>Username</th>
<th>Score</th>
<th>Time Taken</th>
<th>Status</th>
</tr>

<tr>
<td>johnsmith</td>
<td>92%</td>
<td>9m 12s</td>
<td>Passed</td>
</tr>

<tr>
<td>janedoe</td>
<td>87%</td>
<td>11m 02s</td>
<td>Passed</td>
</tr>

</table>

</body>
</html>
