<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/assets/icon1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#335882">
    <title>My Profile | Brampton Develop</title>

    <style>
        :root {
            --primary: #335882;
            --primary-dark: #274666;
            --background: #f5f7fa;
            --surface: #ffffff;
            --text: #202938;
            --muted: #718096;
            --border: #e5eaf0;
            --success: #18794e;
            --danger: #c0392b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .topbar {
            height: 72px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 17px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            color: white;
            background: var(--primary);
            font-weight: 800;
        }

        .back-link {
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        main {
            width: min(100% - 32px, 900px);
            margin: 42px auto;
        }

        .page-heading {
            margin-bottom: 28px;
        }

        .page-heading h1 {
            margin: 0 0 8px;
            font-size: clamp(26px, 4vw, 34px);
            letter-spacing: -1px;
        }

        .page-heading p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .profile-card {
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 5px 24px rgb(30 50 80 / 4%);
        }

        .profile-header {
            padding: 28px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--border);
        }

        .avatar {
            width: 76px;
            height: 76px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: #edf3f9;
            color: var(--primary);
            font-size: 27px;
            font-weight: 700;
        }

        .identity {
            min-width: 0;
        }

        .identity h2 {
            margin: 0 0 7px;
            overflow-wrap: anywhere;
            font-size: 22px;
        }

        .identity p {
            margin: 0;
            color: var(--muted);
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        .role-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 6px;
            background: #edf3f9;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
        }

        .section {
            padding: 28px;
            border-bottom: 1px solid var(--border);
        }

        .section:last-child {
            border-bottom: 0;
        }

        .section h3 {
            margin: 0 0 7px;
            font-size: 17px;
        }

        .section-description {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 20px;
        }

        .field:last-of-type {
            margin-bottom: 0;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 650;
        }

        .field input {
            width: 100%;
            min-height: 46px;
            padding: 12px 14px;
            border: 1px solid #dce3eb;
            border-radius: 8px;
            outline: none;
            background: #fff;
            color: var(--text);
            transition: border-color .2s, box-shadow .2s;
        }

        .field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgb(51 88 130 / 12%);
        }

        .field input:disabled {
            background: #f5f7fa;
            color: var(--muted);
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        .button {
            min-height: 42px;
            padding: 0 17px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 650;
            transition: background .2s, opacity .2s;
        }

        .button-primary {
            background: var(--primary);
            color: white;
        }

        .button-primary:hover {
            background: var(--primary-dark);
        }

        .button-secondary {
            background: #edf1f5;
            color: #35465a;
        }

        .button:disabled {
            cursor: not-allowed;
            opacity: .6;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #eaf7ef;
            color: var(--success);
        }

        .message.error {
            display: block;
            background: #fff0ee;
            color: var(--danger);
        }

        .loading {
            padding: 48px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .hidden {
            display: none !important;
        }

        footer {
            padding: 22px 16px 30px;
            color: var(--muted);
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 560px) {
            .topbar {
                height: 64px;
                padding: 0 18px;
            }

            .brand {
                font-size: 14px;
            }

            main {
                margin-top: 28px;
            }

            .profile-header,
            .section {
                padding: 22px;
            }

            .avatar {
                width: 60px;
                height: 60px;
                border-radius: 15px;
                font-size: 22px;
            }

            .identity h2 {
                font-size: 18px;
            }

            .actions .button {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <a class="brand" href="dashboard.html">
            <span class="brand-mark">B</span>
            <span>Brampton Develop</span>
        </a>

        <a class="back-link" href="dashboard.html">
            Back to dashboard
        </a>
    </header>

    <main>
        <div class="page-heading">
            <h1>My Profile</h1>
            <p>View your account details and manage your profile.</p>
        </div>

        <div id="loading" class="profile-card loading">
            Loading your profile...
        </div>

        <div id="profileContent" class="profile-card hidden">
            <section class="profile-header">
                <div class="avatar" id="avatar">U</div>

                <div class="identity">
                    <h2 id="displayName">User</h2>
                    <p id="userEmail"></p>
                    <span class="role-badge" id="userRole">Staff</span>
                </div>
            </section>

            <section class="section">
                <h3>Personal information</h3>
                <p class="section-description">
                    Your account information and contact details.
                </p>

                <form id="profileForm">
                    <div class="field">
                        <label for="fullName">Display name</label>
                        <input
                            type="text"
                            id="fullName"
                            name="full_name"
                            maxlength="100"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="email">Email address</label>
                        <input
                            type="email"
                            id="email"
                            disabled
                            readonly
                        >
                    </div>

                    <div class="field">
                        <label for="role">Account role</label>
                        <input
                            type="text"
                            id="role"
                            disabled
                            readonly
                        >
                    </div>

                    <div class="actions">
                        <button
                            type="submit"
                            id="saveButton"
                            class="button button-primary"
                        >
                            Save changes
                        </button>

                        <button
                            type="button"
                            id="cancelButton"
                            class="button button-secondary"
                        >
                            Cancel
                        </button>
                    </div>

                    <div
                        id="message"
                        class="message"
                        role="status"
                        aria-live="polite"
                    ></div>
                </form>
            </section>
        </div>
    </main>

    <footer>
        Brampton Develop · Secure account management
    </footer>

    <script>
        const loading = document.getElementById("loading");
        const profileContent = document.getElementById("profileContent");
        const profileForm = document.getElementById("profileForm");
        const fullNameInput = document.getElementById("fullName");
        const saveButton = document.getElementById("saveButton");
        const cancelButton = document.getElementById("cancelButton");
        const message = document.getElementById("message");

        let originalName = "";

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        function clearMessage() {
            message.textContent = "";
            message.className = "message";
        }

        function updateIdentity(name) {
            const safeName = name.trim() || "User";

            document.getElementById("displayName").textContent = safeName;

            document.getElementById("avatar").textContent =
                safeName.charAt(0).toUpperCase();
        }

        async function loadProfile() {
            try {
                const response = await fetch("/api/me", {
                    method: "GET",
                    credentials: "same-origin",
                    cache: "no-store"
                });

                const result = await response.json();

                if (response.status === 401 ||
                    result.authenticated === false) {
                    window.location.replace("/");
                    return;
                }

                if (!response.ok || !result.authenticated ||
                    !result.profile) {
                    throw new Error(
                        result.error || "Unable to load your profile."
                    );
                }

                const profile = result.profile;

                originalName = profile.full_name || "";

                fullNameInput.value = originalName;
                document.getElementById("email").value =
                    profile.email || "";
                document.getElementById("role").value =
                    profile.role || "Staff";
                document.getElementById("userEmail").textContent =
                    profile.email || "";
                document.getElementById("userRole").textContent =
                    profile.role || "Staff";

                updateIdentity(originalName);

                loading.classList.add("hidden");
                profileContent.classList.remove("hidden");

            } catch (error) {
                loading.textContent =
                    "Unable to load your profile. Please refresh the page.";
                console.error("Profile loading failed:", error);
            }
        }

        profileForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            clearMessage();

            const fullName = fullNameInput.value.trim();

            if (!fullName || fullName.length > 100) {
                showMessage(
                    "Enter a display name between 1 and 100 characters.",
                    "error"
                );
                return;
            }

            saveButton.disabled = true;
            saveButton.textContent = "Saving...";

            try {
                const response = await fetch("/api/profile", {
                    method: "PATCH",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        full_name: fullName
                    })
                });

                const result = await response.json();

                if (response.status === 401) {
                    window.location.replace("/");
                    return;
                }

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.error || "Unable to save your profile."
                    );
                }

                const savedProfile = result.user || result.profile || {};
                originalName = savedProfile.full_name || fullName;
                fullNameInput.value = originalName;

                updateIdentity(originalName);

                if (savedProfile.email) {
                    document.getElementById("userEmail").textContent =
                        savedProfile.email;
                    document.getElementById("email").value =
                        savedProfile.email;
                }

                if (savedProfile.role) {
                    document.getElementById("userRole").textContent =
                        savedProfile.role;
                    document.getElementById("role").value =
                        savedProfile.role;
                }

                showMessage(
                    result.message || "Your profile has been updated.",
                    "success"
                );

            } catch (error) {
                showMessage(
                    error.message || "Something went wrong. Please try again.",
                    "error"
                );
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = "Save changes";
            }
        });

        cancelButton.addEventListener("click", function() {
            fullNameInput.value = originalName;
            updateIdentity(originalName);
            clearMessage();
        });

        loadProfile();
    </script>
</body>
</html>
