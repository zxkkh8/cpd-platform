<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecurTrack CPD Portal</title>

css/login.css

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI","Segoe UI Variable",sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.login-container{
    width:420px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
    overflow:hidden;
}

.login-header{
    background:#124191;
    color:white;
    text-align:center;
    padding:30px;
}

.login-header img{
    height:70px;
    margin-bottom:15px;
}

.login-header h1{
    font-size:28px;
    font-weight:600;
}

.login-body{
    padding:40px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#334155;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d9e2ef;
    border-radius:8px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#124191;
}

.login-btn{
    width:100%;
    padding:14px;
    background:#124191;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.login-btn:hover{
    background:#0d2f69;
}

.footer-links{
    margin-top:20px;
    text-align:center;
}

.footer-links a{
    text-decoration:none;
    color:#124191;
    font-size:14px;
}
</style>
</head>

<body>

<div class="login-container">

    <div class="login-header">
        assets/logo.svg
        <h1>SecurTrack CPD</h1>
    </div>

    <div class="login-body">

        dashboard.html

            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Enter username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter password">
            </div>

            <button class="login-btn">
                Sign In
            </button>

        </form>

        <div class="footer-links">
            #Forgot Password?</a>
        </div>

    </div>

</div>

</body>
</html>
