<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/assets/icon1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#335882">

    <meta name="description" content="Sign in to Brampton Develop, a Training and Development Portal.">

    <title>Sign in - Brampton Develop</title>

    <link rel="icon" href="assets/favicon.ico">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: #f3f3f3 url("assets/background.svg") center center / cover no-repeat fixed;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #1b1b1b;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            padding: 42px;
            border: none;
            box-shadow:
                0 2px 6px rgba(0,0,0,.08),
                0 8px 24px rgba(0,0,0,.08);
        }

        .logo {
            width: 46px;
            height: 46px;
            object-fit: contain;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            margin: 24px 0 8px;
        }

        .intro {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 14px;
            margin: 22px 0 7px;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #c8c8c8;
            border-radius: 2px;
            background: #fff;
            font: inherit;
            color: #1b1b1b;
            outline: none;
            transition:
                border-color .15s ease,
                box-shadow .15s ease;
        }

        input:hover {
            border-color: #8a8886;
        }

        input:focus {
            border-color: #335882;
            box-shadow: 0 0 0 1px #335882;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .show-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            padding: 0;
            margin: 0;
            min-width: auto;
            color: #335882;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .show-password:hover {
            background: none;
            text-decoration: underline;
        }

        input::placeholder {
            color: #777;
        }


        input:focus,
        input:focus-visible {
            outline: none;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 2px solid #335882;
            outline-offset: 4px;
        }

        a {
            color: #335882;
            text-decoration: none;
            font-size: 13px;
        }

        a:hover {
            text-decoration: underline;
        }

        .links {
            margin-top: 18px;
        }

        #message {
            color: #a4262c;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-top: 16px;
        }

        #message:empty {
            display: none;
        }

        #message.success {
            color: #107c10;
        }

        button {
            display: block;
            margin: 24px 0 0 auto;
            min-width: 120px;
            padding: 11px 18px;
            background: #335882;
            color: white;
            border: 0;
            font: inherit;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover:not(:disabled) {
            background: #274565;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer {
            position: fixed;
            bottom: 14px;
            right: 20px;
            font-size: 12px;
            color: #333;
            text-shadow: 0 1px 3px #ffffff80;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 30px 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            button {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <img
            class="logo"
            src="assets/logo.svg"
            alt="Brampton Develop"
            width="46"
            height="46"
        >

        <h1>Sign in</h1>
        <p class="intro">Use your Brampton Develop work account.</p>

        <form id="loginForm" action="/api/login" method="post">
            <label for="email">Email address or username</label>
            <input
                id="email"
                name="username"
                type="email"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                maxlength="254"
                placeholder="Email address"
                required
                autofocus
            >

            <label for="password">Password</label>
            <div class="password-wrapper">

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                maxlength="1024"
                required
            >

            <button
                type="button"
                id="togglePassword"
                class="show-password"
            >
                Show
            </button>

            </div>

            <div class="links">
                <a href="forgot-password.html">Forgot my password</a>
            </div>

            <p
                id="message"
                role="alert"
                aria-live="polite"
            ></p>

            <button id="submitButton" type="submit">
                Sign in
            </button>
        </form>
    </main>

    <script>
        (() => {
            "use strict";

            const form = document.getElementById("loginForm");
            const usernameInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const togglePassword = document.getElementById("togglePassword");
            const message = document.getElementById("message");
            const button = document.getElementById("submitButton");

            function showMessage(text, success = false) {
                message.textContent = text;
                message.classList.toggle("success", success);
            }

            function setBusy(busy) {
                button.disabled = busy;
                button.textContent = busy ? "Signing in…" : "Sign in";
                usernameInput.readOnly = busy;
                passwordInput.readOnly = busy;
            }

            const params = new URLSearchParams(window.location.search);

            if (params.get("status") === "deactivated") {
                showMessage(
                    "Your account has been deactivated. Contact your administrator."
                );
            }
            togglePassword?.addEventListener("click", () => {

            const hidden =
                passwordInput.type === "password";

            passwordInput.type =
                hidden ? "text" : "password";

            togglePassword.textContent =
                hidden ? "Hide" : "Show";
            });
            
            form.addEventListener("submit", async event => {
                event.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    showMessage("Enter your username and password.");
                    return;
                }

                setBusy(true);
                showMessage("Signing in…", true);

                try {
                    const response = await fetch("/api/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "same-origin",
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    });

                    const result = await response.json().catch(() => null);

                    if (!response.ok || !result || result.success !== true) {
                        if (response.status === 403) {
                            showMessage(
                                result?.error ||
                                "Your account cannot sign in. Contact your administrator."
                            );
                        } else if (response.status === 401) {
                            showMessage(
                                "We couldn't sign you in with those details."
                            );
                        } else {
                            showMessage(
                                result?.error ||
                                "Sign-in services are temporarily unavailable. Please try again."
                            );
                        }

                        return;
                    }

                    window.location.replace("dashboard.html");
                } catch (error) {
                    console.error(
                        "[Brampton Develop] Server-side login request failed."
                    );

                    showMessage(
                        "Unable to contact the sign-in service. Please try again."
                    );
                } finally {
                    setBusy(false);
                }
            });
        })();
    </script>
</body>
</html>
