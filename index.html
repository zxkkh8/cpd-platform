<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brampton Develop</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI Variable","Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(
        180deg,
        #d8dcf2 0%,
        #b7bee5 55%,
        #28355f 100%
    );
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    opacity:.12;
    background:
    linear-gradient(
        140deg,
        transparent 35%,
        rgba(255,255,255,.4) 35%,
        rgba(255,255,255,.4) 50%,
        transparent 50%
    ),
    linear-gradient(
        40deg,
        transparent 35%,
        rgba(255,255,255,.2) 35%,
        rgba(255,255,255,.2) 50%,
        transparent 50%
    );
}

.login-card{
    width:520px;
    max-width:95%;
    background:#fff;
    border-radius:20px;
    padding:40px;
    box-shadow:
        0 25px 60px rgba(0,0,0,.15);
    position:relative;
    z-index:1;
}

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo img{
    height:90px;
    width:auto;
}

.logo h1{
    margin-top:15px;
    color:#1f2945;
    font-size:34px;
    font-weight:700;
}

.subtitle{
    text-align:center;
    color:#667085;
    margin-bottom:30px;
    font-size:15px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
    color:#4b5563;
}

input[type=text],
input[type=password]{
    width:100%;
    padding:15px;
    border:1px solid #d9dce6;
    border-radius:10px;
    font-size:15px;
    transition:.2s;
}

input:focus{
    outline:none;
    border-color:#7080c4;
    box-shadow:0 0 0 4px rgba(112,128,196,.15);
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    color:#4b5563;
}

.link{
    color:#5c6ee3;
    text-decoration:none;
    font-size:14px;
}

.link:hover{
    text-decoration:underline;
}

.login-btn{
    width:100%;
    border:none;
    padding:16px;
    border-radius:10px;
    background:#7d87c4;
    color:#fff;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    background:#707bba;
}

.error{
    text-align:center;
    color:#dc2626;
    min-height:20px;
    margin-top:15px;
}

.footer{
    margin-top:25px;
    padding-top:20px;
    border-top:1px solid #e5e7eb;
    text-align:center;
    color:#6b7280;
    font-size:14px;
}

</style>
</head>
<body>

<div class="login-card">

    <div class="logo">
        <img id="mainLogo" alt="Brampton Develop Logo">
        <h1>Brampton Develop</h1>
    </div>

    <div class="subtitle">
        Professional Development & Training Portal
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label>Username</label>
            <input
                id="username"
                type="text"
                placeholder="Enter your username"
                autocomplete="username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password">
        </div>

        <div class="options">

            <label class="checkbox">
                <input
                    type="checkbox"
                    onclick="togglePassword()">
                Show Password
            </label>

            #
                Forgot Password?
            </a>

        </div>

        <button
            type="submit"
            class="login-btn">
            Sign In
        </button>

    </form>

    <div
        id="error"
        class="error">
    </div>

    <div class="footer">

        Having trouble signing in?

        #
            Contact Support
        </a>

    </div>

</div>

js/config.jsscript>
https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2script>
js/supabase.jsscript>

<script>

document.addEventListener("DOMContentLoaded", () => {

    if(typeof APP !== "undefined"){

        if(APP.logoPath){
            document.getElementById("mainLogo").src =
                APP.logoPath;
        }

        if(APP.forgotPasswordUrl){
            document.getElementById("forgotPasswordLink").href =
                APP.forgotPasswordUrl;
        }

        if(APP.supportUrl){
            document.getElementById("supportLink").href =
                APP.supportUrl;
        }

    }

});

function togglePassword(){

    const password =
        document.getElementById("password");

    password.type =
        password.type === "password"
        ? "text"
        : "password";

}

document
.getElementById("loginForm")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    await login();

});

async function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const errorBox =
        document.getElementById("error");

    errorBox.textContent = "";

    if(!username || !password){

        errorBox.textContent =
            "Please enter your username and password";

        return;

    }

    try{

        const { data, error } =
            await supabaseClient
            .from("users")
            .select("*")
            .eq("username", username)
            .eq("password", password)
            .single();

        if(error || !data){

            errorBox.textContent =
                "Invalid username or password";

            return;

        }

        localStorage.setItem(
            "currentUser",
            JSON.stringify(data)
        );

        window.location.href =
            "dashboard.html";

    }

    catch{

        errorBox.textContent =
            "Unable to connect to the server";

    }

}

</script>

</body>
</html>
