<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Brampton Develop</title>
<script src="js/loader.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f3f3f3;display:grid;place-items:center;padding:20px;font-family:"Segoe UI",Arial,sans-serif;color:#1b1b1b}
.card{width:100%;max-width:440px;background:white;padding:42px;box-shadow:0 2px 8px #00000012}
.logo{width:42px;height:42px;object-fit:contain}
h1{font-size:25px;font-weight:600;margin:24px 0 8px}
p{font-size:14px;line-height:1.5;color:#444}
label{display:block;font-size:14px;margin:22px 0 7px}
input{width:100%;padding:10px 0;border:0;border-bottom:1px solid #777;border-radius:0;font:inherit;outline:none}
input:focus{border-bottom:2px solid #335882}
a{color:#335882;text-decoration:none;font-size:13px}
a:hover{text-decoration:underline}
.links{margin-top:18px}
button{display:block;margin:28px 0 0 auto;width:120px;padding:10px;background:#335882;color:white;border:0;font:inherit;cursor:pointer}
button:disabled{opacity:.6}
#message{color:#a4262c;font-size:13px;white-space:pre-wrap}
.footer{position:fixed;bottom:12px;right:20px;font-size:12px;color:#555}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="assets/logo.svg" alt="Brampton Develop">
<h1>Sign in</h1>
<p>Use your Brampton Develop work account.</p>

<form id="loginForm">
<label for="email">Email address</label>
<input id="email" type="email" autocomplete="username" required autofocus>

<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>

<div class="links"><a href="forgot-password.html">Forgot my password</a></div>
<p id="message" role="alert" aria-live="polite"></p>
<button id="submitButton" type="submit">Sign in</button>
</form>
</main>
<div class="footer">Brampton Develop</div>

<script>
(async()=>{
const client=window.supabaseClient;
const form=document.getElementById("loginForm");
const message=document.getElementById("message");
const button=document.getElementById("submitButton");

if(!client){message.textContent="Unable to load sign-in services. Please contact support.";return;}

const params=new URLSearchParams(location.search);
if(params.get("status")==="deactivated"){
message.textContent="Your account has been deactivated. Contact your administrator.";
}

const {data:sessionData}=await client.auth.getSession();
if(sessionData.session){
const {data:userData}=await client.auth.getUser();
if(userData.user){
const {data:profile}=await client.from("profiles")
.select("is_active").eq("id",userData.user.id).maybeSingle();
if(profile?.is_active===true)location.replace("dashboard.html");
else await client.auth.signOut();
}
}

form.addEventListener("submit",async event=>{
event.preventDefault();
button.disabled=true;
message.style.color="#a4262c";
message.textContent="Signing in…";
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

const {error}=await client.auth.signInWithPassword({email,password});
if(error){
message.textContent="We couldn't sign you in with those details.";
button.disabled=false;
return;
}

const {data:userData}=await client.auth.getUser();
if(!userData.user){
await client.auth.signOut();
message.textContent="Unable to verify your account.";
button.disabled=false;
return;
}

const {data:profile,error:profileError}=await client.from("profiles")
.select("is_active").eq("id",userData.user.id).maybeSingle();

if(profileError||!profile||profile.is_active!==true){
await client.auth.signOut();
message.textContent="Your account is inactive or has not been configured. Contact your administrator.";
button.disabled=false;
return;
}

location.replace("dashboard.html");
});
})();
</script>
</body>
</html>
