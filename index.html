<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecurTrack CPD</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI Variable","Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(
        180deg,
        #cfd4ef 0%,
        #aab4dd 55%,
        #24315b 100%
    );
    overflow:hidden;
}

.background{
    position:fixed;
    inset:0;
    opacity:.18;
    background:
    linear-gradient(150deg,
    transparent 35%,
    rgba(255,255,255,.3) 35%,
    rgba(255,255,255,.3) 50%,
    transparent 50%),
    linear-gradient(30deg,
    transparent 35%,
    rgba(255,255,255,.2) 35%,
    rgba(255,255,255,.2) 50%,
    transparent 50%);
}

.login-container{
    position:relative;
    z-index:2;

    width:500px;
    background:#ffffff;

    border-radius:12px;

    padding:40px;

    box-shadow:
    0 25px 50px rgba(0,0,0,.15);
}

.logo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;

    margin-bottom:35px;
}

.logo img{
    height:55px;
}

.logo h1{
    font-size:22px;
    color:#1e243d;
}

.heading{
    text-align:center;
    margin-bottom:30px;
}

.heading h2{
    font-size:20px;
    color:#29324d;
    font-weight:400;
}

.form-group{
    margin-bottom:22px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#4b5563;
    font-size:15px;
}

input[type=text],
input[type=password]{
    width:100%;
    padding:14px;
    border:1px solid #d6dae3;
    border-radius:5px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#6474b9;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    color:#4b5563;
    font-size:15px;
}

.checkbox input{
    width:18px;
    height:18px;
}

.options a{
    color:#4f6be6;
    text-decoration:none;
}

.login-btn{
    width:100%;
    border:none;
    border-radius:8px;
    padding:15px;
    background:#9198c4;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
}

.login-btn:hover{
    background:#7f87bc;
}

.error{
    text-align:center;
    color:#dc2626;
    margin-top:15px;
    min-height:20px;
}

.footer{
    margin-top:35px;
    padding-top:20px;
    border-top:1px solid #e5e7eb;
    text-align:center;
    color:#6b7280;
    font-size:14px;
}

.footer a{
    color:#4f6be6;
    text-decoration:none;
}

</style>
</head>
<body>

<div class="background"></div>

<div class="login-container">

    <div class="logo">

        assets/logo.svg

        <h1>SecurTrack CPD</h1>

    </div>

    <div class="heading">

        <h2>Sign in to SecurTrack CPD</h2>

    </div>

    <div class="form-group">

        <label>Username</label>

        <input
            id="username"
            type="text"
            placeholder="Enter your username">

    </div>

    <div class="form-group">

        <label>Password</label>

        <input
            id="password"
            type="password"
            placeholder="Enter your password">

    </div>

    <div class="options">

        <label class="checkbox">

            <input
                type="checkbox"
                onclick="togglePassword()">

            Show Password

        </label>

        #
            Forgot Password?
        </a>

    </div>

    <button
        class="login-btn"
        onclick="login()">

        Sign In

    </button>

    <div
        id="error"
        class="error">
    </div>

    <div class="footer">

        Having trouble signing in?

        #
            Contact Support
        </a>

    </div>

</div>

https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2script>
js/supabase.jsscript>

<script>

function togglePassword(){

    const password =
    document.getElementById("password");

    if(password.type === "password"){

        password.type = "text";

    }else{

        password.type = "password";

    }

}

async function login(){

    const username =
    document.getElementById("username").value;

    const password =
    document.getElementById("password").value;

    const errorBox =
    document.getElementById("error");

    errorBox.innerHTML = "";

    const { data, error } =
    await supabaseClient
        .from("users")
        .select("*")
        .eq("username", username)
        .eq("password", password)
        .single();

    if(error || !data){

        errorBox.innerHTML =
        "Invalid username or password";

        return;

    }

    localStorage.setItem(
        "currentUser",
        JSON.stringify(data)
    );

    window.location.href =
    "dashboard.html";

}

</script>

</body>
</html>
