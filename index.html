
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brampton Develop</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI","Segoe UI Variable",Tahoma,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.20);
    backdrop-filter:blur(2px);
}

.login-card{
    position:center;
    z-index:10;

    width:440px;
    max-width:95%;

    background:#ffffff;

    padding:44px;

    border-radius:4px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.18);
}

.logo{
    text-align:center;
    margin-bottom:24px;
}

.logo img{
    height:60px;
    width:auto;
    margin-bottom:16px;
}

.logo h1{
    font-size:28px;
    font-weight:600;
    color:#1b1b1b;
    margin-bottom:4px;
}

.subtitle{
    color:#616161;
    font-size:14px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#323130;
    font-size:14px;
    font-weight:600;
}

input[type=text],
input[type=password]{

    width:100%;

    padding:12px;

    border:1px solid #8a8886;

    border-radius:2px;

    font-size:14px;

    transition:.2s;
}

input:focus{

    outline:none;

    border-color:#0078d4;

    box-shadow:
        0 0 0 1px #0078d4;
}

.options{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:24px;

    font-size:13px;
}

.checkbox{

    display:flex;

    align-items:center;

    gap:8px;

    color:#605e5c;
}

.options a,
.footer a{

    color:#005a9e;

    text-decoration:none;
}

.options a:hover,
.footer a:hover{

    text-decoration:underline;
}

.login-btn{

    width:100%;

    background:#0078d4;

    color:white;

    border:none;

    padding:12px;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

    border-radius:2px;

    transition:.2s;
}

.login-btn:hover{

    background:#106ebe;
}

.error{

    margin-top:15px;

    text-align:center;

    color:#d13438;

    min-height:18px;

    font-size:14px;
}

.footer{

    margin-top:24px;

    padding-top:20px;

    border-top:1px solid #edebe9;

    text-align:center;

    font-size:13px;

    color:#605e5c;
}

.loading{

    opacity:.7;
    pointer-events:none;
}

@media(max-width:600px){

    .login-card{

        padding:32px 24px;
    }

    .options{

        flex-direction:column;
        gap:12px;
        align-items:flex-start;
    }

}

</style>
</head>
<body>

<div id="loading" class="page-loader">

    <div class="oval-loader"></div>

    <p class="loading-text">Loading...</p>

</div>

<div class="overlay"></div>

<div class="login-card">

    <div class="logo">

        <img
            id="logo"
            src="assets/logo.svg"
            alt="Brampton Primary School Branding">

        <h1 id="companyName">
            Brampton Develop
        </h1>

        <div
            id="portalName"
            class="subtitle">
            Development & Training Portal
        </div>

    </div>

    <form id="loginForm">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                id="username"
                type="text"
                autocomplete="username"
                placeholder="Enter your username">

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password">

        </div>

        <div class="options">

            <label class="checkbox">

                <input
                    type="checkbox"
                    id="showPassword">

                Show password

            </label>

            <a
                id="forgotPasswordLink"
                href="#">
                Forgot password?
            </a>

        </div>

        <button
            id="loginButton"
            type="submit"
            class="login-btn">

            Sign In

        </button>

    </form>

    <div
        id="error"
        class="error">
    </div>

    <div class="footer">

        Need help?

        <a
            id="supportLink"
            href="https://your-support-url.com">
            Contact Us
        </a>

    </div>

</div>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    if(typeof APP !== "undefined"){

        if(APP.backgroundImage){

            document.body.style.backgroundImage =
                `url('${APP.backgroundImage}')`;

        }

        if(APP.logoPath){

            document.getElementById("logo").src =
                APP.logoPath;

        }

        if(APP.companyName){

            document.getElementById("companyName").textContent =
                APP.companyName;

        }

        if(APP.portalName){

            document.getElementById("portalName").textContent =
                APP.portalName;

        }

        if(APP.forgotPasswordUrl){

            document.getElementById("forgotPasswordLink").href =
                APP.forgotPasswordUrl;

        }

        if(APP.supportUrl){

            document.getElementById("supportLink").href =
                APP.supportUrl;

        }

    }

});
</script>

<script>

document
.getElementById("showPassword")
.addEventListener("change", function(){

    const password =
        document.getElementById("password");

    password.type =
        this.checked
        ? "text"
        : "password";

});

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const username =
        document.getElementById("username")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const errorBox =
        document.getElementById("error");

    const button =
        document.getElementById("loginButton");

    errorBox.textContent = "";

    if(!username || !password){

        errorBox.textContent =
            "Please enter your username and password.";

        return;
    }

    button.classList.add("loading");
    button.textContent = "Signing in...";

    try{

        const result =
            await loginUser(
                username,
                password
            );

        if(!result.success){

            errorBox.textContent =
                result.message;

            button.classList.remove("loading");
            button.textContent = "Sign In";

            return;
        }

        window.location.href =
            APP.dashboardPage;

    }

    catch{

        errorBox.textContent =
            "Unable to connect to the server.";

        button.classList.remove("loading");
        button.textContent = "Sign In";
    }

});

</script>

</body>
</html>
