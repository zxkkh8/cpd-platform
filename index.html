
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign in - Brampton Develop</title>

<style>
:root {
    --brand: #335882;
    --brand-dark: #274666;
    --background: #f5f7fa;
    --surface: #fff;
    --text: #202a36;
    --muted: #687587;
    --border: #dce3eb;
    --danger: #b42318;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--background);
    color: var(--text);
}

header {
    padding: 22px 6%;
    background: white;
    border-bottom: 1px solid var(--border);
}

.brand {
    display: flex;
    align-items: center;
    gap: 13px;
}

.brand img {
    max-width: 135px;
    max-height: 42px;
    object-fit: contain;
}

.brand h1 {
    font-size: 17px;
    font-weight: 650;
}

.brand p {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
}

main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 35px 20px;
}

.login-card {
    width: 100%;
    max-width: 420px;
    padding: 38px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 35px rgba(30, 50, 75, .06);
}

h2 {
    font-size: 25px;
    letter-spacing: -.5px;
}

.intro {
    margin-top: 9px;
    margin-bottom: 28px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
}

.field {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 12px;
    font-weight: 650;
}

input {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    outline: none;
    background: white;
    color: var(--text);
    font-size: 13px;
}

input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(51, 88, 130, .12);
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 65px;
}

.show-password {
    position: absolute;
    top: 0;
    right: 0;
    height: 44px;
    padding: 0 12px;
    border: 0;
    background: transparent;
    color: var(--brand);
    font-size: 11px;
    font-weight: 650;
    cursor: pointer;
}

.form-options {
    display: flex;
    justify-content: flex-end;
    margin: 0 0 22px;
}

a {
    color: var(--brand);
    text-decoration: none;
    font-size: 12px;
}

a:hover {
    text-decoration: underline;
}

.submit {
    width: 100%;
    height: 44px;
    border: 0;
    border-radius: 7px;
    background: var(--brand);
    color: white;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
}

.submit:hover {
    background: var(--brand-dark);
}

.submit:disabled {
    opacity: .65;
    cursor: wait;
}

.message {
    display: none;
    margin-bottom: 18px;
    padding: 12px;
    border-radius: 7px;
    font-size: 12px;
    line-height: 1.5;
}

.message.error {
    display: block;
    color: var(--danger);
    background: #fef3f2;
    border: 1px solid #fecdca;
}

.message.success {
    display: block;
    color: #166534;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
}

footer {
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
}

@media (max-width: 480px) {
    .login-card {
        padding: 28px 22px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="assets/logo.svg" alt="Brampton Develop logo"
             onerror="this.style.display='none'">
        <div>
            <h1>Brampton Develop</h1>
            <p>Development &amp; Training Portal</p>
        </div>
    </div>
</header>

<main>
    <section class="login-card">
        <h2>Sign in</h2>
        <p class="intro">
            Welcome back. Sign in to access your Brampton Develop account.
        </p>

        <div id="message" class="message" role="alert"></div>

        <form id="loginForm">
            <div class="field">
                <label for="email">Email address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your email address"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button class="show-password" id="togglePassword"
                            type="button">Show</button>
                </div>
            </div>

            <div class="form-options">
                <a href="forgot-password.html">Forgot password?</a>
            </div>

            <button class="submit" id="submitButton" type="submit">
                Sign in
            </button>
        </form>
    </section>
</main>

<footer>
    Brampton Develop &copy; <span id="year"></span>
</footer>

<script src="js/loader.js"></script>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");
const passwordInput = document.getElementById("password");

document.getElementById("togglePassword").addEventListener("click", () => {
    const showing = passwordInput.type === "text";
    passwordInput.type = showing ? "password" : "text";
    document.getElementById("togglePassword").textContent =
        showing ? "Show" : "Hide";
});

function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = "message " + type;
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value;

    message.className = "message";
    submitButton.disabled = true;
    submitButton.textContent = "Signing in...";

    try {
        const client = window.supabaseClient;

        if (!client?.auth) {
            throw new Error("Authentication is not configured. Please try again later.");
        }

        const { data, error } = await client.auth.signInWithPassword({
            email,
            password
        });

        if (error) throw error;

        const user = data.user;

        if (!user) {
            throw new Error("We couldn't retrieve your account. Please try again.");
        }

        let profile = {};

        try {
            const { data: profileData, error: profileError } = await client
                .from("profiles")
                .select("*")
                .eq("id", user.id)
                .maybeSingle();

            if (profileError) {
                console.warn("Profile lookup failed:", profileError.message);
            } else if (profileData) {
                profile = profileData;
            }
        } catch (profileError) {
            console.warn("Profile lookup failed:", profileError);
        }

        const currentUser = {
            id: user.id,
            email: user.email || email,
            name: profile.full_name || profile.display_name ||
                  user.user_metadata?.full_name ||
                  user.user_metadata?.name ||
                  user.email,
            full_name: profile.full_name || profile.display_name ||
                       user.user_metadata?.full_name ||
                       user.user_metadata?.name ||
                       "",
            role: profile.role || user.user_metadata?.role || ""
        };

        localStorage.setItem("currentUser", JSON.stringify(currentUser));

        showMessage("Sign-in successful. Redirecting...", "success");
        window.location.replace("dashboard.html");

    } catch (error) {
        console.error("Sign-in failed:", error);
        showMessage(
            error.message === "Invalid login credentials"
                ? "Your email address or password is incorrect."
                : error.message || "Unable to sign in. Please try again."
        );
        submitButton.disabled = false;
        submitButton.textContent = "Sign in";
    }
});
</script>

</body>
</html>
