<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/assets/icon1.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password - Brampton Develop</title>
<script src="js/loader.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f5f7fa;font-family:"Segoe UI",Arial,sans-serif;color:#242424}
.card{width:100%;max-width:440px;background:white;padding:34px;border:1px solid #e1e5eb;border-radius:10px}
img{width:48px;height:48px;object-fit:contain}
h1{font-size:26px;margin:22px 0 8px}
p{font-size:14px;line-height:1.5;color:#666}
label{display:block;margin:22px 0 7px;font-size:14px;font-weight:600}
input{width:100%;padding:12px;border:1px solid #b8bec8;border-radius:5px;font:inherit}
button{width:100%;padding:12px;margin-top:20px;background:#335882;color:white;border:0;border-radius:5px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
a{color:#335882;font-size:14px;text-decoration:none}
#message{white-space:pre-wrap}
</style>
</head>
<body>
<main class="card">
<img src="assets/logo.svg" alt="Brampton Develop">
<h1>Forgot your password?</h1>
<p>Enter your work email address. If an account exists, we'll send instructions to reset its password.</p>
<form id="forgotForm">
<label for="email">Work email address</label>
<input id="email" type="email" autocomplete="email" required>
<button id="sendButton" type="submit">Send recovery code</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<a href="index.html">Back to sign in</a>
</main>
<script>
(()=>{
const client=window.supabaseClient;
const form=document.getElementById("forgotForm");
const button=document.getElementById("sendButton");
const message=document.getElementById("message");
if(!client){message.textContent="Recovery service is unavailable.";return;}

form.addEventListener("submit",async event=>{
event.preventDefault();
button.disabled=true;
message.textContent="Requesting recovery email…";
const email=document.getElementById("email").value.trim();
const {error}=await client.auth.resetPasswordForEmail(email,{
redirectTo:location.origin+"/reset-password.html"
});
if(error){
message.textContent="We couldn't send the recovery email. Please try again later.";
button.disabled=false;
return;
}
sessionStorage.setItem("passwordRecoveryEmail",email);
message.textContent="If an account exists for that address, a recovery email has been sent. Check your inbox and spam folder, then enter the code on the next page.";
setTimeout(()=>location.href="reset-password.html",1800);
});
})();
</script>
</body>
</html>
