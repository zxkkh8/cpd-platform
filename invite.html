<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Your Password | Brampton Develop</title>
  <script src="js/loader.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f5f7fa; font-family: "Segoe UI", Arial, sans-serif; color: #202938; }
    .card { width: 100%; max-width: 430px; padding: 32px; background: white; border: 1px solid #e3e8ef; border-radius: 12px; }
    .logo { width: 52px; height: 52px; object-fit: contain; }
    h1 { font-size: 25px; margin-bottom: 8px; }
    p { color: #687588; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; font-size: 14px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd3df; border-radius: 6px; font: inherit; }
    button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 6px; background: #335882; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { white-space: pre-wrap; font-size: 14px; }
    a { color: #335882; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/logo.svg" alt="Brampton Develop">
    <h1>Set your password</h1>
    <p>Complete your staff account setup by choosing a secure password.</p>

    <form id="passwordForm">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="12" autocomplete="new-password" required>
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required>
      <button id="submitButton" type="submit">Set password</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
  (async () => {
    const client = window.supabaseClient;
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    if (!client) {
      message.textContent = "Unable to load authentication. Please contact your administrator.";
      return;
    }

    // Supabase must be configured to detect the invitation link's session.
    const { data, error } = await client.auth.getSession();

    if (error || !data.session) {
      message.textContent = "This invitation is invalid or has expired. Ask your administrator to send a new invitation.";
      return;
    }

    document.getElementById("passwordForm").addEventListener("submit", async event => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password.length < 12) {
        message.textContent = "Your password must be at least 12 characters long.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "The passwords do not match.";
        return;
      }

      button.disabled = true;
      message.textContent = "Setting your password…";

      const { error: updateError } = await client.auth.updateUser({ password });

      if (updateError) {
        message.textContent = updateError.message;
        button.disabled = false;
        return;
      }

      message.textContent = "Your password has been set. You can now sign in.";
      await client.auth.signOut();
      setTimeout(() => location.replace("index.html"), 1200);
    });
  })();
  </script>
</body>
</html>
