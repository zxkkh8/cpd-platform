<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/assets/icon1.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password | Brampton Develop</title>
<script src="js/loader.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f5f7fa;font-family:"Segoe UI",Arial,sans-serif;color:#242424}
.card{width:100%;max-width:460px;background:white;padding:32px;border:1px solid #e1e5eb;border-radius:10px}
.logo{width:48px;height:48px;object-fit:contain}
h1{font-size:25px;margin:22px 0 8px}
p{color:#666;font-size:14px;line-height:1.5}
label{display:block;font-size:14px;font-weight:600;margin:17px 0 7px}
input{width:100%;padding:11px;border:1px solid #b8bec8;border-radius:5px;font:inherit}
.requirements{margin-top:14px;padding:13px;background:#f7f8fa;border:1px solid #e5e8ed;border-radius:7px}
.requirements h2{font-size:14px;margin:0 0 10px}
.rule{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:13px;color:#626b76}
.rule input{width:16px;height:16px;margin:0;accent-color:#18794e;pointer-events:none}
.rule.met{color:#18794e}
button{width:100%;padding:12px;margin-top:20px;background:#335882;color:white;border:0;border-radius:5px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
a{color:#335882;font-size:14px;text-decoration:none}
#message{white-space:pre-wrap}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="assets/logo.svg" alt="Brampton Develop">
<h1>Reset your password</h1>
<p>Enter the email address and verification code from your recovery email.</p>

<form id="resetForm">
<label for="email">Email address</label>
<input id="email" type="email" autocomplete="email" required>

<label for="code">Email verification code</label>
<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required>

<label for="password">New password</label>
<input id="password" type="password" autocomplete="new-password" required>

<div class="requirements">
<h2>Password requirements</h2>
<div class="rule" data-rule="length"><input type="checkbox" disabled><span>At least 12 characters</span></div>
<div class="rule" data-rule="upper"><input type="checkbox" disabled><span>One uppercase letter (A–Z)</span></div>
<div class="rule" data-rule="lower"><input type="checkbox" disabled><span>One lowercase letter (a–z)</span></div>
<div class="rule" data-rule="number"><input type="checkbox" disabled><span>One number (0–9)</span></div>
<div class="rule" data-rule="special"><input type="checkbox" disabled><span>One special character</span></div>
</div>

<label for="confirmPassword">Confirm new password</label>
<input id="confirmPassword" type="password" autocomplete="new-password" required>
<div id="matchMessage" class="rule">Passwords must match.</div>

<button id="submitButton" type="submit" disabled>Verify code and reset password</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<p><a href="forgot-password.html">Request a new code</a> · <a href="index.html">Back to sign in</a></p>
</main>

<script>
(()=>{
const client=window.supabaseClient;
const email=document.getElementById("email");
const code=document.getElementById("code");
const password=document.getElementById("password");
const confirmPassword=document.getElementById("confirmPassword");
const button=document.getElementById("submitButton");
const message=document.getElementById("message");
const form=document.getElementById("resetForm");

email.value=sessionStorage.getItem("passwordRecoveryEmail")||"";
if(!client){message.textContent="Recovery service is unavailable.";return;}

function validPassword(value){
return{
length:value.length>=12,
upper:/[A-Z]/.test(value),
lower:/[a-z]/.test(value),
number:/[0-9]/.test(value),
special:/[^A-Za-z0-9]/.test(value)
};
}
function validate(){
const rules=validPassword(password.value);
let all=true;
document.querySelectorAll("[data-rule]").forEach(row=>{
const ok=rules[row.dataset.rule];
row.querySelector("input").checked=ok;
row.classList.toggle("met",ok);
if(!ok)all=false;
});
const matches=password.value.length>0&&password.value===confirmPassword.value;
document.getElementById("matchMessage").textContent=matches?"Passwords match.":"Passwords must match.";
document.getElementById("matchMessage").classList.toggle("met",matches);
button.disabled=!(all&&matches&&email.value.trim()&&code.value.trim());
}
[password,confirmPassword,email,code].forEach(el=>el.addEventListener("input",validate));

form.addEventListener("submit",async event=>{
event.preventDefault();
validate();
if(button.disabled)return;
button.disabled=true;
message.textContent="Verifying code…";

const {data:verified,error:verifyError}=await client.auth.verifyOtp({
email:email.value.trim(),
token:code.value.trim(),
type:"recovery"
});
if(verifyError||!verified?.user){
message.textContent="The code is invalid or has expired. Request a new recovery code and try again.";
button.disabled=false;
return;
}

message.textContent="Updating password…";
const {error:updateError}=await client.auth.updateUser({password:password.value});
if(updateError){
message.textContent=updateError.message;
button.disabled=false;
return;
}
sessionStorage.removeItem("passwordRecoveryEmail");
await client.auth.signOut();
message.textContent="Password reset successfully. Redirecting to sign in…";
setTimeout(()=>location.replace("index.html"),1200);
});
})();
</script>
</body>
</html>
